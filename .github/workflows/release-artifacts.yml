name: Release Artifacts

# Two deploy lanes:
#  - Every push to main rebuilds the capypkg modules and overwrites the
#    rolling `latest` GitHub Release.
#  - A semver tag (v1.2.3) cuts a frozen release for that tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to publish (defaults to 'latest')"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

concurrency:
  group: capyui-release
  cancel-in-progress: false

jobs:
  package:
    name: Package capypkg modules
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve and validate release target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag || 'latest' }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$'

          if [ "$REF_TYPE" = "tag" ]; then
            release_tag="$REF_NAME"
            checkout_ref="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && \
               [ "$REQUESTED_RELEASE_TAG" != "latest" ]; then
            release_tag="$REQUESTED_RELEASE_TAG"
            checkout_ref="$REQUESTED_RELEASE_TAG"
          else
            release_tag="latest"
            checkout_ref="$SOURCE_SHA"
          fi

          if [ "$release_tag" != "latest" ] && \
             ! [[ "$release_tag" =~ $tag_pattern ]]; then
            echo "Invalid release tag: expected latest or v<semver>" >&2
            exit 1
          fi
          if [ "$release_tag" = "latest" ] && \
             [ "$EVENT_NAME" = "workflow_dispatch" ] && \
             [ "$REQUESTED_RELEASE_TAG" != "latest" ]; then
            echo "Invalid workflow_dispatch release target" >&2
            exit 1
          fi

          printf '%s\n' "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          printf '%s\n' "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout CapyUI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential make

      - name: Verify release metadata
        id: metadata
        shell: bash
        env:
          TARGET_RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$TARGET_RELEASE_TAG" != "latest" ]; then
            test "$TARGET_RELEASE_TAG" = "v${version}"
            test "$(git describe --tags --exact-match HEAD)" = "$TARGET_RELEASE_TAG"
          fi
          printf '%s\n' "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate and package
        shell: bash
        env:
          TARGET_RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          set -euo pipefail
          make validate
          make package-clean
          make package PUBLISH_TAG="$TARGET_RELEASE_TAG"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capyui-capypkg-${{ github.run_id }}
          path: |
            build/capypkg/*.bin
            build/capypkg/*.manifest
            build/capypkg/modules-index.txt
          if-no-files-found: error

      - name: Refresh rolling `latest` tag
        if: steps.target.outputs.release_tag == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Move (or create) the rolling `latest` tag to the current commit
          # before action-gh-release publishes against it. softprops/action
          # would otherwise create a tag pointing at the wrong commit on
          # rerun.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.target.outputs.release_tag }}
          name: ${{ steps.target.outputs.release_tag == 'latest' && 'CapyUI rolling latest' || format('CapyUI {0}', steps.target.outputs.release_tag) }}
          body: |
            Automated capypkg release for `${{ steps.target.outputs.release_tag }}` built
            from checked-out commit ${{ steps.metadata.outputs.source_sha }}.

            Consumers should fetch the index via the semver release tag:
              https://github.com/${{ github.repository }}/releases/download/${{ steps.target.outputs.release_tag }}/modules-index.txt
          prerelease: false
          make_latest: true
          files: |
            build/capypkg/*.bin
            build/capypkg/*.manifest
            build/capypkg/modules-index.txt
